name: gold-alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check news and send alerts
        run: python main.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JUDGE_PROVIDER: ${{ vars.JUDGE_PROVIDER }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE }}
          MAX_AGE_MIN: ${{ vars.MAX_AGE_MIN }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          CAL_LEAD_MIN: ${{ vars.CAL_LEAD_MIN }}
          CAL_COUNTRIES: ${{ vars.CAL_COUNTRIES }}
      - name: Save state
        run: |
          git config user.name "gold-alerts-bot"
          git config user.email "gold-alerts-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
